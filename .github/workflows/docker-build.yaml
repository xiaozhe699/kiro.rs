name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
      - 'test/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional image tag override (e.g., 2026.1.1 or test-429)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${{ github.repository_owner }}/kiro-rs"
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"

          sanitize_ref() {
            echo "$1" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's#[^a-z0-9_.-]+#-#g; s#^-+##; s#-+$##; s#-+#-#g' \
              | cut -c1-90
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="$(sanitize_ref "${{ github.event.inputs.version }}")"
            ALIAS_TAG="$VERSION"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="$(sanitize_ref "${{ github.ref_name }}")"
            ALIAS_TAG="latest"
          else
            SAFE_BRANCH="$(sanitize_ref "${{ github.ref_name }}")"
            VERSION="${SAFE_BRANCH}-${SHORT_SHA}"
            if [ "$SAFE_BRANCH" = "main" ] || [ "$SAFE_BRANCH" = "master" ]; then
              ALIAS_TAG="beta"
            else
              ALIAS_TAG="$SAFE_BRANCH"
            fi
          fi

          {
            echo "image=$IMAGE"
            echo "version=$VERSION"
            echo "alias=$ALIAS_TAG"
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:${ALIAS_TAG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Will push ${IMAGE}:${VERSION} and ${IMAGE}:${ALIAS_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Kiro.rs Docker Image
